<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hazard in 3D</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0d10; overflow: hidden; }
      body { font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: #e8eaed; }
      #view { position: absolute; inset: 0; }
      .card {
        position: absolute; z-index: 2; background: rgba(15, 17, 20, .82);
        border: 1px solid rgba(255, 255, 255, .12); padding: 10px 12px;
        backdrop-filter: blur(6px); max-width: min(92vw, 360px);
      }
      #hud { top: 12px; left: 12px; }
      #hud h1 { margin: 0 0 2px; font-size: 14px; font-weight: 600; }
      #hud .ticket { color: #9fd0ff; font-family: ui-monospace, monospace; font-size: 11px; }
      #hud dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 8px 0 0; }
      #hud dt { color: #9aa3ad; }
      #hud dd { margin: 0; font-variant-numeric: tabular-nums; }
      #controls { bottom: 12px; left: 12px; }
      #controls .row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
      #controls .row:first-child { margin-top: 0; }
      #controls label { color: #9aa3ad; width: 68px; flex: none; }
      #controls input[type="range"] { flex: 1; min-width: 120px; accent-color: #4f9cf9; }
      #controls output { width: 52px; flex: none; text-align: right; font-variant-numeric: tabular-nums; }
      #controls .buttons { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
      button {
        font: inherit; color: #e8eaed; background: rgba(255, 255, 255, .08);
        border: 1px solid rgba(255, 255, 255, .18); padding: 5px 9px; cursor: pointer;
      }
      button:hover { background: rgba(255, 255, 255, .16); }
      .checks { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; color: #c7ccd3; }
      .checks label { width: auto; display: inline-flex; gap: 5px; align-items: center; color: #c7ccd3; }
      #status {
        top: 12px; left: 50%; transform: translateX(-50%); max-width: min(92vw, 520px);
        border-color: rgba(248, 113, 113, .5); color: #fecaca;
      }
      [hidden] { display: none !important; }
      .hint { margin: 10px 0 0; color: #9aa3ad; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="view"></div>

    <section id="hud" class="card">
      <h1 id="title">Loading hazard…</h1>
      <div class="ticket" id="ticket"></div>
      <dl>
        <dt>Severity</dt><dd id="severity">—</dd>
        <dt>Status</dt><dd id="status-value">—</dd>
        <dt>Detected</dt><dd id="detected">—</dd>
        <dt>Location</dt><dd id="coords">—</dd>
        <dt>Heading</dt><dd id="heading">—</dd>
      </dl>
      <p class="hint">
        The dashcam photo is draped on the road at these coordinates. Drag to orbit,
        scroll to zoom, right-drag to tilt.
      </p>
    </section>

    <section id="controls" class="card" hidden>
      <div class="row">
        <label for="size">Patch</label>
        <input id="size" type="range" min="0.5" max="20" step="0.25" value="3" />
        <output id="size-out">3.0 m</output>
      </div>
      <div class="row">
        <label for="rotation">Rotate</label>
        <input id="rotation" type="range" min="0" max="359" step="1" value="0" />
        <output id="rotation-out">0°</output>
      </div>
      <div class="row">
        <label for="opacity">Opacity</label>
        <input id="opacity" type="range" min="0" max="100" step="1" value="100" />
        <output id="opacity-out">100%</output>
      </div>
      <div class="buttons">
        <button id="view-dashcam" type="button">Dashcam view</button>
        <button id="view-top" type="button">Top down</button>
        <button id="view-wide" type="button">Pull back</button>
      </div>
      <div class="checks">
        <label><input id="toggle-outline" type="checkbox" checked /> Outline</label>
        <label><input id="toggle-buildings" type="checkbox" /> 3D buildings</label>
      </div>
    </section>

    <section id="status" class="card" hidden></section>

    <script type="module" src="/src/scene3d.ts"></script>
  </body>
</html>
