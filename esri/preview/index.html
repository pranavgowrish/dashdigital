<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DashDigital Twin Preview</title>
  <link rel="stylesheet" href="https://js.arcgis.com/4.34/esri/themes/light/main.css">
  <script src="config.js"></script>
  <script src="https://js.arcgis.com/4.34/"></script>
  <style>
    html, body, #view { margin: 0; width: 100%; height: 100%; }
    #status { position: absolute; top: 12px; left: 12px; padding: 6px 10px; border-radius: 6px;
              background: rgba(20, 20, 20, .75); color: #fff; font: 13px system-ui, sans-serif; }
  </style>
</head>
<body>
  <div id="view"></div>
  <div id="status">Loading…</div>
  <script>
    // Preview of the Person 3 Web Scene, upgraded with Google Photorealistic 3D Tiles.
    // Person 4 can lift the "photoreal" block straight into the dashboard's SceneView.
    require([
      "esri/config", "esri/WebScene", "esri/views/SceneView",
      "esri/layers/IntegratedMesh3DTilesLayer", "esri/core/reactiveUtils",
    ], (esriConfig, WebScene, SceneView, IntegratedMesh3DTilesLayer, reactiveUtils) => {
      const cfg = window.TWIN_CONFIG;
      const status = document.getElementById("status");
      esriConfig.portalUrl = cfg.portalUrl;

      const scene = new WebScene({ portalItem: { id: cfg.webSceneId } });
      const view = new SceneView({ container: "view", map: scene, qualityProfile: "high" });
      window.view = view;

      view.when(async () => {
        const hazards = scene.allLayers.find((l) => l.title === "Road Hazards");
        const buildings = scene.allLayers.find((l) => l.title.startsWith("3D Buildings"));

        if (cfg.googleKey) {
          // --- photoreal ---
          const photoreal = new IntegratedMesh3DTilesLayer({
            url: "https://tile.googleapis.com/v1/3dtiles/root.json",
            customParameters: { key: cfg.googleKey }, // the SDK strips query params from url
            title: "Google Photorealistic 3D Tiles",
          });
          scene.add(photoreal, 0);
          buildings.visible = false; // the mesh already contains every building, tree and car
          // Pins rest on top of the mesh (road surface) instead of the bare terrain under it.
          hazards.elevationInfo = { mode: "relative-to-scene" };
          // --- /photoreal ---
          status.textContent = "Google Photorealistic 3D + Esri hazard layer";
        } else {
          status.textContent = "No GOOGLE_MAPS_API_KEY: showing Esri-only scene";
        }

        // Person 4's drill-down: click a pin -> fly to street level facing the car's heading.
        reactiveUtils.on(() => view, "click", async (event) => {
          const hit = (await view.hitTest(event, { include: [hazards] })).results[0];
          if (!hit) return;
          const g = hit.graphic;
          await view.goTo({
            target: g.geometry,
            zoom: 20,
            tilt: 72,
            heading: g.attributes.heading_deg ?? view.camera.heading,
          }, { duration: 1800 });
        });

        const params = new URLSearchParams(location.search);
        if (params.has("oid")) {
          const { features } = await hazards.queryFeatures({
            objectIds: [Number(params.get("oid"))], outFields: ["*"], returnGeometry: true,
          });
          if (features[0]) {
            await view.goTo({ target: features[0].geometry, zoom: 20, tilt: 72,
                              heading: features[0].attributes.heading_deg }, { animate: false });
          }
        }
        await reactiveUtils.whenOnce(() => !view.updating);
        document.title = "READY";
      });
    });
  </script>
</body>
</html>
