<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pothole In Scene</title>
  <link rel="stylesheet" href="https://js.arcgis.com/5.2/@arcgis/core/assets/esri/themes/light/main.css">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    #wrap { position: relative; width: 100%; height: 100%; }
    #view, #splat { position: absolute; inset: 0; width: 100%; height: 100%; }
    #splat { pointer-events: none; }  /* Esri keeps all mouse/touch navigation */
    #hud { position: absolute; top: 12px; left: 56px; padding: 6px 10px; border-radius: 6px;
           background: rgba(20, 20, 20, .78); color: #fff; font: 13px system-ui, sans-serif; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "@sparkjsdev/spark": "https://cdn.jsdelivr.net/npm/@sparkjsdev/spark@2.4.0/dist/spark.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="wrap"><div id="view"></div><canvas id="splat"></canvas></div>
  <div id="hud">Loading…</div>
  <script type="module">
    // ArcGIS SceneView (terrain, 3D buildings, hazard pins) with the ml-sharp pothole splat
    // drawn in lockstep: every frame the three.js/Spark camera copies the Esri camera,
    // expressed in local ENU meters around the hazard (z = 0 on Esri's terrain there).
    import * as THREE from "three";
    import { SparkRenderer, SplatMesh } from "@sparkjsdev/spark";

    const core = "https://js.arcgis.com/5.2/@arcgis/core";
    const [{ default: esriConfig }, { default: WebScene }, { default: SceneView }, { default: Point }] =
      await Promise.all(["config", "WebScene", "views/SceneView", "geometry/Point"].map((m) => import(`${core}/${m}.js`)));

    const params = new URLSearchParams(location.search);
    const hud = document.getElementById("hud");
    const HAZARD = { lon: -117.333004, lat: 33.975725 };  // hazard #1, University Ave
    const SPLAT = params.get("splat") || "splats/pothole_esri_enu.splat";
    const zOffset = Number(params.get("dz") || 0.02);    // lift a hair above terrain to avoid z-fighting

    esriConfig.portalUrl = "https://ucr.maps.arcgis.com";
    const scene = new WebScene({ portalItem: { id: "c744dc6317fe4518af927c46db6999c1" } });
    const view = new SceneView({ container: "view", map: scene, qualityProfile: "high" });
    window.view = view;

    // three.js / Spark overlay
    const canvas = document.getElementById("splat");
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: false });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);
    const scene3 = new THREE.Scene();
    scene3.add(new SparkRenderer({ renderer }));
    const cam3 = new THREE.PerspectiveCamera(50, 1, 0.05, 3000);
    const pothole = new SplatMesh({ url: SPLAT });
    scene3.add(pothole);

    const mPerDegLat = 111320, mPerDegLon = 111320 * Math.cos(HAZARD.lat * Math.PI / 180);
    const X = new THREE.Vector3(1, 0, 0), Z = new THREE.Vector3(0, 0, 1);
    let groundZ = null;

    function resize() {
      const w = view.container.clientWidth, h = view.container.clientHeight;
      renderer.setSize(w, h, false);
      cam3.aspect = w / h;
    }

    function sync() {
      if (groundZ === null) return;
      const c = view.camera, w = view.width, h = view.height;
      cam3.position.set(
        (c.position.longitude - HAZARD.lon) * mPerDegLon,
        (c.position.latitude - HAZARD.lat) * mPerDegLat,
        c.position.z - groundZ - zOffset,
      );
      // Esri: heading clockwise from north, tilt 0 = straight down. A three camera with no
      // rotation looks down -Z (= straight down in ENU) with +Y (north) as up: tilt about
      // local X, then heading about world Z (clockwise => negative angle).
      const qH = new THREE.Quaternion().setFromAxisAngle(Z, -c.heading * Math.PI / 180);
      const qT = new THREE.Quaternion().setFromAxisAngle(X, c.tilt * Math.PI / 180);
      cam3.quaternion.copy(qH.multiply(qT));
      // Esri fov is diagonal; three wants vertical.
      const d = c.fov * Math.PI / 180;
      cam3.fov = 2 * Math.atan(Math.tan(d / 2) * h / Math.hypot(w, h)) * 180 / Math.PI;
      cam3.aspect = w / h;
      cam3.updateProjectionMatrix();
    }

    view.when(async () => {
      resize();
      new ResizeObserver(resize).observe(view.container);
      const pt = new Point({ longitude: HAZARD.lon, latitude: HAZARD.lat });
      groundZ = (await scene.ground.queryElevation(pt)).geometry.z;
      const cam = (params.get("cam") || "6,1.5,3").split(",").map(Number);  // east, north, up (m)
      await view.goTo({
        position: { x: HAZARD.lon + cam[0] / mPerDegLon, y: HAZARD.lat + cam[1] / mPerDegLat, z: groundZ + cam[2], spatialReference: { wkid: 4326 } },
        heading: Number(params.get("heading") || 255), tilt: Number(params.get("tilt") || 62),
      }, { animate: false });
      await pothole.initialized;
      hud.textContent = `ArcGIS SceneView + pothole splat (terrain ${groundZ.toFixed(1)} m) · drag to orbit`;
      renderer.setAnimationLoop(() => { sync(); renderer.render(scene3, cam3); });
      setTimeout(() => (document.title = "READY"), 2500);
    });
  </script>
</body>
</html>
