<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Esri Pothole Splat</title>
  <link rel="stylesheet" href="https://js.arcgis.com/5.2/@arcgis/core/assets/esri/themes/light/main.css">
  <style>
    html, body, #view { margin: 0; width: 100%; height: 100%; }
    #hud { position: absolute; top: 12px; left: 56px; padding: 6px 10px; border-radius: 6px;
           background: rgba(20, 20, 20, .78); color: #fff; font: 13px system-ui, sans-serif; }
  </style>
</head>
<body>
  <div id="view"></div>
  <div id="hud">Loading…</div>
  <script type="module">
    // The DashDigital Web Scene (terrain + 3D buildings + hazard pins) with the ml-sharp
    // pothole splat converted to 3D Tiles and placed at hazard #1 as a GaussianSplatLayer.
    const core = "https://js.arcgis.com/5.2/@arcgis/core";
    const [{ default: esriConfig }, { default: WebScene }, { default: SceneView }, { default: GaussianSplatLayer }, reactiveUtils] =
      await Promise.all(["config", "WebScene", "views/SceneView", "layers/GaussianSplatLayer", "core/reactiveUtils"]
        .map((m) => import(`${core}/${m}.js`)));
    {
      const params = new URLSearchParams(location.search);
      const hud = document.getElementById("hud");
      esriConfig.portalUrl = "https://ucr.maps.arcgis.com";

      const scene = new WebScene({ portalItem: { id: "c744dc6317fe4518af927c46db6999c1" } });
      const view = new SceneView({ container: "view", map: scene });
      window.view = view;

      const pothole = new GaussianSplatLayer({
        url: params.get("tiles") || "https://tiles.arcgis.com/tiles/RCT9RCgW4FY2e7Dk/arcgis/rest/services/DashDigital_Pothole_1_splat_v2/3DTilesServer/tileset.json",  // hosted on UCR ArcGIS Online
        title: "Pothole (ml-sharp splat)",
      });
      scene.add(pothole);

      view.when(async () => {
        await pothole.load().catch((err) => { hud.textContent = `Splat layer failed: ${err.message}`; throw err; });
        // Hazard #1: University Ave, Riverside. Camera a few meters east of the pothole.
        const [lon, lat] = [-117.333004, 33.975725];
        const cam = (params.get("cam") || "6,1.5,3").split(",").map(Number); // east, north, up (m)
        const mPerDegLat = 111320, mPerDegLon = 111320 * Math.cos(lat * Math.PI / 180);
        await view.goTo({
          position: { x: lon + cam[0] / mPerDegLon, y: lat + cam[1] / mPerDegLat, z: 315 + cam[2], spatialReference: { wkid: 4326 } },
          heading: Number(params.get("heading") || 255),
          tilt: Number(params.get("tilt") || 62),
        }, { animate: false });
        hud.textContent = "ArcGIS SceneView · pothole as GaussianSplatLayer (3D Tiles)";
        view.whenLayerView(pothole).catch((err) => {
          const inner = err.details && err.details.error;
          const msg = `layer view failed: ${err.name}: ${err.message} | inner: ${inner ? (inner.name + ": " + inner.message + " " + JSON.stringify(inner.details || {}).slice(0, 300)) : "none"}`;
          console.error(msg); hud.textContent = msg;
        });
        await reactiveUtils.whenOnce(() => !view.updating);
        document.title = "READY";
      });
    }
  </script>
</body>
</html>
