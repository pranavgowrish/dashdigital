<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hazard Splat Viewer</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0d10; overflow: hidden; }
    #hud { position: absolute; top: 12px; left: 12px; padding: 8px 12px; border-radius: 8px;
           background: rgba(15, 17, 20, .78); color: #e8eaed; font: 13px/1.45 system-ui, sans-serif; }
    #hud b { color: #fff; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "@sparkjsdev/spark": "https://cdn.jsdelivr.net/npm/@sparkjsdev/spark@2.4.0/dist/spark.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="hud">Loading splat…</div>
  <script type="module">
    // Street splat is in local ENU meters (x=east, y=north, z=up), origin at the hazard,
    // z=0 on the road. See ../georef.py.
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { SparkRenderer, SplatMesh } from "@sparkjsdev/spark";

    const params = new URLSearchParams(location.search);
    // ?oid=<hazard OBJECTID> resolves the street + pothole splats from twins.json
    // (that's how the dashboard links in); ?site=&pothole= still work directly.
    const twins = await fetch("twins.json").then((r) => r.json()).catch(() => ({}));
    const twin = twins[params.get("oid")] || {};
    const site = params.get("site") || twin.site || "hazard1";
    const potholeFile = params.get("pothole") || twin.pothole;
    const hud = document.getElementById("hud");

    const renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.add(new SparkRenderer({ renderer }));

    const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.05, 500);
    camera.up.set(0, 0, 1);
    // Start where the Street View car drove (camera height ~2.5 m): views close to the
    // captured ones look best. ?cam=x,y,z&look=x,y,z overrides.
    const [cx, cy, cz] = (params.get("cam") || "10,0.5,2.5").split(",").map(Number);
    const [lx, ly, lz] = (params.get("look") || "0,0,0").split(",").map(Number);
    camera.position.set(cx, cy, cz);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(lx, ly, lz);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI * 0.495; // don't dive under the road
    // Only 10 panoramas along one line were captured, so stay near street level and
    // close to the drive path: views far from the capture cameras fill with floaters.
    controls.minPolarAngle = Math.PI * 0.30;
    controls.minDistance = 2;
    controls.maxDistance = 16;

    // Hazard marker: a pin floating above the hazard with a thin stem down to the road,
    // so it never covers the pothole itself.
    const pin = new THREE.Group();
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.16, 24, 16),
                                new THREE.MeshBasicMaterial({ color: 0xdc2626, transparent: true }));
    head.position.z = 1.9;
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 1.75, 8),
                                new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 }));
    stem.rotation.x = Math.PI / 2;
    stem.position.z = 0.95;
    pin.add(head, stem);
    scene.add(pin);

    const street = new SplatMesh({ url: `splats/${site}.splat` });
    scene.add(street);
    street.initialized.then(() => {
      hud.innerHTML = `<b>${site}</b> · drag to orbit, right-drag to pan, scroll to zoom`;
      document.title = "READY";
    }).catch((err) => { hud.textContent = `Failed to load splat: ${err}`; });

    // Optional pothole splat placed at the hazard (from ml-sharp, see README).
    if (potholeFile) {
      const pothole = new SplatMesh({ url: `splats/${potholeFile}` });
      scene.add(pothole);
    }

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
    renderer.setAnimationLoop(() => {
      controls.update();
      head.material.opacity = 0.75 + 0.25 * Math.sin(performance.now() / 300);
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
